      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>Surgery and the collection of records</h2><p>Charlie reports that Strauss has performed the operation while he was asleep. His account cannot supply unseen surgical details. Burt records temperature and blood pressure daily and explains the records as supporting repetition of the procedure.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>Surgery and the collection of records</h2><p>According to Burt, progress reports will be copied and studied for insight into Charlie&#x27;s mind. Charlie questions this premise from his own difficulty understanding his records. Kinnian&#x27;s explanation of gradual improvement is qualified as uncertain and does not yet establish a measured change.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Secrecy, teaching and the first reported maze improvement</h2><p>Burt identifies the foundation funding and attributes secrecy to Nemur&#x27;s fear of ridicule if the project fails. Charlie says continued participation involves weekly pay.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Secrecy, teaching and the first reported maze improvement</h2><p>Strauss claims tests and records show improvement but says permanence is uncertain. On March 29 Charlie reports nine maze victories out of ten races, an observed task outcome distinct from the scientists&#x27; broader interpretations. Nemur&#x27;s teaching-machine explanation remains a reported mechanism.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>New task performance and disputed measurement</h2><p>Charlie&#x27;s successful dough mixing leads to promotion with a raise. He reports improved retention and understanding punctuation after a grammar book. Kinnian says the original reports are to remain unchanged.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>New task performance and disputed measurement</h2><p>Charlie reports a current IQ around 100 and a forecast beyond 150. His earlier baseline is now described as 70, differing from the earlier reported 68; neither is silently corrected. Nemur, Strauss and Burt give different explanations of IQ.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>New task performance and disputed measurement</h2><p>The inkblot procedure is now explicitly named Rorschach. A recording supplies the earlier instruction asking what a blot suggests, and Charlie reports imagining figures in the new session. His wish to keep some reports private emerges here.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>Temporary privacy and disagreement about success</h2><p>Charlie obtains permission to withhold personal reports temporarily, while Nemur retains eventual review before the foundation report and publication.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>Temporary privacy and disagreement about success</h2><p>Nemur commits to a Chicago paper and claims success and no remaining risk. Strauss says Charlie is still changing and warns against claiming too much. Nemur&#x27;s dismissal of regression risk is retained alongside the earlier warnings, not treated as evidence of permanence.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>Temporary privacy and disagreement about success</h2><p>Strauss cites psychosurgery techniques and enzyme-injection patterns and Nemur invokes his original theory. The disagreement establishes what they claim, not the technical details of an observed procedure.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>Salary, communication and the next presentation</h2><p>The foundation now supplies Charlie&#x27;s salary as the convention approaches. Charlie reports an IQ of 185 and typing nearly seventy-five words per minute. Strauss emphasizes intelligible communication, while Charlie reports increasing distance from Alice and a platonic relationship. Numerical gains are not presented as resolving the interpersonal difficulties.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>A remembered treatment and a present ethical objection</h2><p>The Guarino recollection distinguishes the machine&#x27;s observable hum and lights from its claimed ability to increase intelligence. Guarino promises no guaranteed success while prescribing continuing visits. The described episode provides no measured intellectual result.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>A remembered treatment and a present ethical objection</h2><p>Charlie now attributes his drive to please Rose and win her love. He values Guarino&#x27;s treating him as human despite judging him exploitative, and resents Nemur&#x27;s implied claim to have made him a person.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Reported mechanisms and the challenge to permanence</h2><p>At Chicago Nemur names a type of phenylketonuria and describes an enzyme-block mechanism with claimed chemical and tissue interventions. Charlie cites critiques the researchers have not yet read. These are competing scientific claims within the report.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Reported mechanisms and the challenge to permanence</h2><p>Burt reports variable behavior at Algernon&#x27;s intelligence peak but explicitly refuses a direct causal conclusion. Surgery as a common cause and individual variation are alternatives.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Reported mechanisms and the challenge to permanence</h2><p>Charlie says the waiting-period assessment relies on ordinary animals and argues enhanced subjects need longer observation. He still says the suspected mistake does not necessarily mean serious harm.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Reported mechanisms and the challenge to permanence</h2><p>The presentation exposes filmed tests, previously unknown photographs and therapy details. Charlie says most Alice details remained in his private file. His subsequent flight with Algernon interrupts the planned public demonstration.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>Charlie seeks independent work</h2><p>After defending the diner worker, Charlie resolves to use his skills in intelligence research and seek foundation permission. His broader hopes remain proposed possibilities, not demonstrated extensions of the technique.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>Charlie seeks independent work</h2><p>He contacts Landsdoff about biophysics and submits a separate linguistic paper; neither is proof of acceptance or experimental validation. He is uncertain how much time he has.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>Charlie seeks independent work</h2><p>Algernon’s erratic behavior renews, followed by biting and confused maze movements despite learning. Charlie withholds a snap explanation and decides on laboratory assessment.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 15 · July 12</summary><h2>Independent study and contingency planning</h2><p>The foundation authorizes Charlie’s project work with lab, staff and priority computing, as relayed by Nemur. Burt reports losses in Algernon’s responses but proposes reassessment after readjustment.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 15 · July 12</summary><h2>Independent study and contingency planning</h2><p>Charlie distinguishes having recorded the earlier temporary-effect warning from having understood it. Nemur’s account names possible emotional complications and below-baseline regression, with Warren and lifetime financial support as contingencies. Independent living remains possible if Charlie can manage. Charlie requests a visit rather than assuming immediate admission.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><h2>The unresolved rule of failure</h2><p>Algernon’s decreased motivation requires feeding assistance. Later he succeeds twice at a maze before an error, intense reaction and temporary stupor. Charlie asks whether this is an isolated case or a general failure in the procedure.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><h2>The unresolved rule of failure</h2><p>Charlie works from a lab cot and feels close to a solution on July 31, but this unit does not yet supply the solution. His heightened perception and blending of memory with sensation are self-reported experiences.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><h2>The Algernon-Gordon conclusion</h2><p>Charlie’s completed report concludes limited current applicability and states a proportional deterioration rule. His own rapid deterioration is initially a prediction, while Algernon’s impairments are reported observations.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><h2>The Algernon-Gordon conclusion</h2><p>The results go to Hallston for checking and Nemur reports confirmation. Charlie advises no further human testing until additional animal work clarifies the flaw. Suggested enzyme-imbalance work remains a possible direction.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><h2>The Algernon-Gordon conclusion</h2><p>Charlie subsequently reports forgetfulness and Algernon’s death and postmortem findings. He fears corresponding changes in himself without claiming an observed examination of his own brain. His assertion that no one is to blame is his judgment.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 3 – October 11</summary><h2>Declining performance and withdrawal from testing</h2><p>Charlie reports increasing difficulty writing, slower maze solving and failure to recall the ink-card method. Burt emphasizes voluntary participation and Charlie refuses further tests, offering his reports instead.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 3 – October 11</summary><h2>Declining performance and withdrawal from testing</h2><p>He also describes lost reading comprehension and forgetting his address. These are reported functional changes; the subjective therapy vision is not treated as an externally observed physical event or a proven mechanism.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>The final functional and written record</h2><p>Charlie reports loss of understanding of his paper, worsening coordination and inability to read the foreign languages he tests. He switches from typing to handwriting and later explicitly describes using easier words. The unnormalized November language is preserved as textual evidence, alongside self-reported difficulty reading and writing.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>The final functional and written record</h2><p>His hope of maintaining ability through reading and later hopes about charms or powder do not demonstrate efficacy. His inability to recall the earlier explanation does not replace or invalidate the already registered research chronology. At the end he remembers contributing to science but not what he found. His stated destination is Warren, with no narrated later assessment or outcome.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><p><a href="assets/189a4f897453e9.jpg">Open noncanonical illustration</a></p><p>The surgical room.</p></details></noscript>
