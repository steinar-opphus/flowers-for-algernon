      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>Appearance</h2><p>Charlie meets an unnamed woman on a bench near the Central Park lake. She holds a coat around herself despite heat and he describes straight dark shoulder-length hair and a puffy face.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>The meeting and her account</h2><p>She says she is from Newport News, married a sailor long absent, and has a wealthy shipbuilder father who opposes her elopement. Her account includes an allegation of a violent wedding-night assault. These are her statements, not independently verified history.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>The meeting and her account</h2><p>She later says she is five months pregnant by a man other than her husband. Charlie reacts angrily and is uncertain whether he grabs her shoulder before she screams. Subsequent shouted accusations and the claim of weapons remain unverified.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><p><a href="assets/47c76637c39c48.jpg">Open noncanonical illustration</a></p><p>A conversation by the lake.</p></details></noscript>
