      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>The bar outing</h2><p>Charlie now names his coworker Frank Reilly. Frank and Joe Carp invite Charlie to Hal-lorans Bar. Charlie&#x27;s account describes laughter during his lampshade dance and finding his companions gone after going outside.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>The joke that leads to a promotion</h2><p>Frank encourages Charlie&#x27;s mixer attempt as an April Fool&#x27;s joke. Charlie succeeds instead. At the later party Frank identifies the fake apple given to Charlie as wax fruit.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>The kick and the proposed lesson</h2><p>Charlie now identifies Frank as the person who kicked his legs out in the old bakery recollection. There he describes Frank as tall and thin. Frank proposes teaching Charlie to make rolls, but Charlie becomes confused by the bakers&#x27; different arm and hand positions.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>Resentment of Charlie&#x27;s new ideas</h2><p>Frank tells Charlie that his ideas make the other workers look foolish. His stated resentment is recorded separately from Charlie&#x27;s interpretation of the group&#x27;s motives.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>Among the friends at the bakery</h2><p>Gimpy tells Charlie to call him, Joe or Frank if anyone bothers him and says they are his friends. The reassurance is reported speech, not an erasure of earlier treatment.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><p><a href="assets/9650b6fde71063.jpg">Open noncanonical illustration</a></p><p>An evening at the bar.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><p><a href="assets/a46c6314d4e44b.jpg">Open noncanonical illustration</a></p><p>The remembered rolls lesson.</p></details></noscript>
