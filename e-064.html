      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>The presentation still ahead</h2><p>On June 5 Charlie identifies the International Psychological Convention in Chicago as a week away. He describes himself and Algernon as the main exhibits in Nemur&#x27;s presentation. Alice later tells him she will not attend with him. No presentation outcome is yet established.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>The flight and the proposed recording</h2><p>Charlie flies toward Chicago on June 10 and records the report on a portable recorder. Nemur wants the latest tape used at the session. No presentation outcome is recorded within this unit.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Papers, the public presentation and the escape</h2><p>The initial booking problem sends the group to the Independence Hotel. At the later meeting the chairman introduces the Beekman team and the group sits on the platform with Algernon between Burt and Charlie.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Papers, the public presentation and the escape</h2><p>Burt reports animal-behavior variability with explicit uncertainty about cause. Films of Charlie&#x27;s old tests are shown, along with photographs he did not know had been taken. Strauss discusses therapy details and Nemur reads report excerpts.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Papers, the public presentation and the escape</h2><p>Nemur&#x27;s claim that Charlie had not existed before the experiment conflicts with Charlie&#x27;s understanding of his history and personhood. Charlie opens Algernon&#x27;s cage, setting off a chase and ultimately leaving with him.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><p><a href="assets/e4537a2d374345.jpg">Open noncanonical illustration</a></p><p>Dictating in flight.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><p><a href="assets/46c20561c2ddf0.jpg">Open noncanonical illustration</a></p><p>Algernon in the convention corridor.</p></details></noscript>
