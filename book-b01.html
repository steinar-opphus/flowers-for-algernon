      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · Progris riport 1 martch 3</summary><h2>Introduction</h2><p>Charlie Gordon records his thoughts at Dr Strauss’s request. He hopes to become smart and attends Miss Kinnian’s class.</p></details><details><summary>Flowers for Algernon · Progris riport 1 martch 3</summary><h2>Progris riport 1 martch 3</h2><p>Charlie Gordon begins a report at Dr Strauss&#x27;s request, recording that Strauss wants his thoughts, memories and experiences. Strauss reportedly says these records will help determine whether they can use him. Charlie hopes to be chosen because Miss Kinnian has suggested that they may be able to make him smart; this is a possibility she voices, rather than a demonstrated result. Charlie says he wants to be smart.</p></details><details><summary>Flowers for Algernon · Progris riport 1 martch 3</summary><h2>Progris riport 1 martch 3</h2><p>Charlie describes working at Donners bakery, receiving eleven dollars a week from Mr Donner and bread or cake if wanted. He gives his age as thirty-two and says his birthday is next month. He attends Miss Kinnian&#x27;s class three times a week in his time off.</p></details><details><summary>Flowers for Algernon · Progris riport 1 martch 3</summary><h2>Progris riport 1 martch 3</h2><p>:

: </p></details><details><summary>Flowers for Algernon · Progris riport 2—martch 4</summary><h2>Progris riport 2—martch 4</h2><p>Charlie visits Professor Nemur&#x27;s office during his lunch break and meets a tester named Burt. Burt shows him white ink-marked cards with red and black markings. Charlie sees ink rather than pictures and tries wearing his glasses to help.</p></details><details><summary>Flowers for Algernon · Progris riport 2—martch 4</summary><h2>Progris riport 2—martch 4</h2><p>Burt reportedly explains that other people imagine pictures in the inkblots. Charlie instead says he imagines spilled ink. He believes he may have failed and fears that this will prevent his selection; no official test result is given in this report.</p></details><details><summary>Flowers for Algernon · Progris riport 2—martch 4</summary><h2>Progris riport 2—martch 4</h2><p>: 
:

: 
: </p></details><details><summary>Flowers for Algernon · 3d progris riport · martch 5</summary><h2>3d progris riport · martch 5</h2><p>Strauss and Nemur tell Charlie that the ink-card issue does not matter and that he may still be used. Strauss relays Kinnian&#x27;s favorable assessment of Charlie as a pupil. Nemur says the experiment has only been tried on animals and that its effect on people is uncertain. Charlie says he is willing to endure pain and work hard.</p></details><details><summary>Flowers for Algernon · 3d progris riport · martch 5</summary><h2>3d progris riport · martch 5</h2><p>Family permission is reportedly required. Charlie says Uncle Herman, his former carer, is dead and that he has not seen his parents or younger sister Norma for a long time. He does not know whether they are alive. Strauss offers to look for them.</p></details><details><summary>Flowers for Algernon · 3d progris riport · martch 5</summary><h2>3d progris riport · martch 5</h2><p>Charlie reports losing sleep over his writing and being shouted at by Gimpy after dropping rolls at work. He nevertheless describes Gimpy as a friend.</p></details><details><summary>Flowers for Algernon · 3d progris riport · martch 5</summary><h2>3d progris riport · martch 5</h2><p>:

: </p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Progris riport 4 · mar 6</h2><p>A woman administers what Charlie records as the “THEMATIC APPERCEPTON TEST,” asking him to invent stories about pictured people. He associates invention with the lying for which he recalls being punished as a child. She describes the tests as assessing personality; Charlie again guesses he has failed.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Progris riport 4 · mar 6</h2><p>Burt, now identified as Burt Selden, takes Charlie to the psychology laboratory at Beekman University and asks him to trace a maze. In the fifth-floor animal laboratory, Burt introduces the white mouse Algernon. Charlie sees the mouse complete a maze.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Progris riport 4 · mar 6</h2><p>Burt sets up races using a wooden maze and electric stylus for Charlie. Charlie receives small shocks when taking wrong turns, and Algernon wins the first race and ten further attempts. Charlie says he learns to finish by watching Algernon, despite taking a long time.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Progris riport 4 · mar 6</h2><p>:

: </p></details><details><summary>Flowers for Algernon · Progris riport 5 mar 6</summary><h2>Progris riport 5 mar 6</h2><p>Charlie reports that Norma has been found living with their mother in Brooklyn, and that permission for the operation has been given. The researchers decide to use him. Strauss argues for his suitability and motivation, while Burt relays Alice Kinnian&#x27;s recommendation.</p></details><details><summary>Flowers for Algernon · Progris riport 5 mar 6</summary><h2>Progris riport 5 mar 6</h2><p>Harold Nemur agrees to proceed but stresses that much can go wrong. His assurances of no physical danger coexist with warnings that the procedure could fail or succeed temporarily and leave Charlie worse off. He says such an outcome would mean returning to Warren state home. Charlie remains eager and resolves to work hard.</p></details><details><summary>Flowers for Algernon · Progris riport 5 mar 6</summary><h2>Progris riport 5 mar 6</h2><p>:

: </p></details><details><summary>Flowers for Algernon · Progris riport 6th Mar 8</summary><h2>Progris riport 6th Mar 8</h2><p>Before the operation, Charlie is frightened. Burt brings flowers and Joe Carp brings a cake from the bakery. Kinnian visits and adjusts his pillow. Charlie holds his rabbit&#x27;s foot and lucky penny; his idea that science may bring luck records his own understanding.</p></details><details><summary>Flowers for Algernon · Progris riport 6th Mar 8</summary><h2>Progris riport 6th Mar 8</h2><p>Charlie says the bakery has been told he is ill rather than told about the operation, following Nemur&#x27;s instructions. Nemur offers conditional possibilities of beating Algernon and treating others if the result is permanent. Charlie&#x27;s central hope is to become smart and have friends.</p></details><details><summary>Flowers for Algernon · Progris riport 6th Mar 8</summary><h2>Progris riport 6th Mar 8</h2><p>:

: </p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</h2><p>Charlie reports that Strauss operated while he slept. After three days with eye and head bandages, his eye bandages are removed, allowing him to write again. He recalls a green surgical room with observers seated high around it, being restrained, and breathing through a rubber mask before sleep.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</h2><p>Burt records Charlie&#x27;s temperature and blood pressure daily and explains the research purpose of the records and copied progress reports. Charlie questions how reports will reveal his mind to others. Nemur asks for more feelings, thoughts and memories.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</h2><p>The nurse Hilda suggests that the operation may interfere with God&#x27;s intentions and that Charlie should pray for forgiveness. Charlie becomes afraid of angering God; these are Hilda&#x27;s religious claims and Charlie&#x27;s response, not established explanations of the procedure. On March 13 Lucille replaces her and says Hilda is working in maternity.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</h2><p>Charlie feels physically fine but not smart. Kinnian says change is gradual and requires work; with expressed uncertainty, she describes the operation as intended to help learning remain with him. Charlie contrasts this with his expectation of an immediate change.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</h2><p>:

: </p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>After leaving hospital Charlie remains frustrated with testing and reports headaches. Burt says the Welberg foundation funds the project and attributes its secrecy to Nemur&#x27;s fear of ridicule. Charlie resumes bakery work with nightly testing and says he will receive weekly pay for participation.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>At the bakery, Donner describes his long-standing arrangement with Herman and his role in obtaining Charlie&#x27;s outside work placement from Warren. He promises Charlie continuing employment while keeping Ernie as an apprentice. Charlie asks to become an apprentice too. He hears his name used in jokes about mistakes but does not understand why.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>Nemur lends Charlie a teaching machine that is said to stimulate learning, dreams and recollection near sleep. It initially disrupts his sleep; Strauss later helps him lower the volume. Charlie recalls how Fanny Birden directed him toward the adult center and describes talking therapy with Strauss.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>At Hal-lorans Bar, Charlie dances with a lampshade on his head while others laugh. He interprets the company as friendly, but later finds everyone gone after he is sent outside. Mrs Flynn says a policeman brings him home. The cause of his later bruises is not established; Joe offers possibilities. His account of being lost in a store is explicitly a dream.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>On March 29 Charlie reports beating Algernon in nine of ten races. When he holds the mouse he notices cotton-soft fur and black eyes with pink edges. He objects to the food-lock testing Burt describes. He begins reading Robinson Crusoe with Kinnian, responding to its protagonist&#x27;s loneliness, and practices spelling with her.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>Charlie nevertheless says he does not feel smarter.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>PROGRESS REPORT 8 · March 15 – March 31</h2><p>:

s from his earlier report of 68 and is retained without reconciliation.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>PROGRESS REPORT 9 · April 1 – April 18</h2><p>An April 17 nightmare leads Charlie to a recalled school episode involving Harriet and a locket with a message written by Hymie Roth. He remembers Harriet&#x27;s brothers accusing him of a dirty note and beating him. His recollection does not establish what Hymie actually wrote.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>PROGRESS REPORT 9 · April 1 – April 18</h2><p>On April 18 Charlie recognizes the Rorschach as the earlier inkblot test. Angry at a perceived trick, he hears a recording of Burt&#x27;s instructions asking what the inkblot brings to mind. He then imagines figures in the cards while retaining some distrust. He also considers asking to keep reports private.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>PROGRESS REPORT 9 · April 1 – April 18</h2><p>:

 though their faces remain unclear.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>PROGRESS REPORT 10 · April 21 – April 28</h2><p>The childhood recollection describes Charlie&#x27;s spinner, parental disagreement over how he should learn, and fear about going to the bathroom alone. He soils himself and recalls Matt leaving as Rose begins spanking him. These events remain attributed to Charlie&#x27;s recovered memory.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>PROGRESS REPORT 10 · April 21 – April 28</h2><p>:

: </p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>PROGRESS REPORT 11 · May 1 – May 10</h2><p>Charlie goes to a movie and dinner with Alice Kinnian, whose brown eyes and brown hair he now notices with attraction. He is self-conscious about closeness and unsure how she feels. Alice expresses responsibility for his participation and argues against making the relationship personal yet.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>PROGRESS REPORT 11 · May 1 – May 10</h2><p>Charlie explicitly questions the reliability of his recovered memories. A nightmare and childhood recollection prompt him to question the origins of his present fear, without establishing a complete explanation. He insists that he was already a person before surgery.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>PROGRESS REPORT 11 · May 1 – May 10</h2><p>At the bakery Charlie observes a $3.95 cake rung at $2.95 and sees Gimpy pocket a half-dollar. He then totals Mrs Wheeler&#x27;s purchases at $4.53 but hears a charge of $2.45. He concludes there is deliberate undercharging and worries his deliveries have made him an unwitting participant. The distinction between observations and his conclusion is retained.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>PROGRESS REPORT 11 · May 1 – May 10</h2><p>Conflicted about telling Donner, Charlie seeks advice. Nemur counsels noninvolvement, Strauss says he must tell, and Alice tells him he must decide for himself. Charlie begins to trust his own judgment but no action resolving the matter is recorded within this unit.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>PROGRESS REPORT 11 · May 1 – May 10</h2><p>Charlie tells Alice he loves her. She says they are changing at different rates and asks for time. She agrees to an outing where they will not be alone, proposing a Central Park concert the following week. After she kisses his cheek, Charlie declares himself in love.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>PROGRESS REPORT 11 · May 1 – May 10</h2><p>:

: </p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>PROGRESS REPORT 11 · May 11 – May 25</h2><p>Charlie reports three more suspicious sales and decides to warn Gimpy rather than immediately tell Donner. Through an indirect conversation, he says he will report the matter if it continues. Gimpy says the employee has no choice and warns Charlie he will regret interfering. Charlie regards the matter as settled while questioning his decision; no independently observed long-term cessation is established here.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>PROGRESS REPORT 11 · May 11 – May 25</h2><p>Charlie&#x27;s rapid reading attracts onlookers, leading to a private library room. He now finds student conversation unsatisfying and hears an economics professor acknowledge the limits of his specialty and no longer regards professors as intellectual giants. At a concert with Alice in Central Park, he experiences physical panic and perceives a watching figure. Alice says she sees no one; Charlie later calls it a hallucination and reports Strauss&#x27;s interpretation in terms of emotional development.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>PROGRESS REPORT 11 · May 11 – May 25</h2><p>On May 20 Charlie loses his bakery job. Arthur Donner says his work is not at fault but cites employee pressure. Charlie is allowed to appeal to the workers, but Frank expresses resentment and Gimpy rejects his plea. Fanny alone reportedly refuses to sign the petition, while still voicing religious objections to the change.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>PROGRESS REPORT 11 · May 11 – May 25</h2><p>Charlie visits Alice&#x27;s apartment on May 25. She interprets his loss as a repetition of childhood rejection, but he says an intellectual explanation does not ease his panic. Recollections lead him to hope for relief, yet the physical response recurs when she holds him. She comforts him and he cries himself to sleep. The image of the maiden wielding the sword is explicitly a subsequent dream, not a change in the actual painting.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>PROGRESS REPORT 11 · May 11 – May 25</h2><p>:

: </p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>PROGRESS REPORT 13 · June 10</h2><p>Charlie flies toward Chicago and dictates this report after Burt suggests a recorder and later transcription. Nemur plans to play the most recent tape at the session. Charlie is frightened of flying and being strapped in.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>PROGRESS REPORT 13 · June 10</h2><p>The seat belt and aircraft sensations lead into a recollection from around age five. Rose believes Dr Guarino can help, while Matt questions the practitioner and the cost. The recollection now supplies Rose&#x27;s surname, Gordon.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>PROGRESS REPORT 13 · June 10</h2><p>Guarino claims diagnostic testing must come first and insists on a continuing course without guaranteed success. Charlie recalls being restrained, the machine humming and flashing, and a cloth placed in his mouth. The episode ends in panic and loss of consciousness. Guarino then claims he is smarter, but this recollection supplies no measured improvement.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>PROGRESS REPORT 13 · June 10</h2><p>As landing approaches, Charlie realizes he has worn the seat belt for almost two hours and says it no longer seems to bother him. He now interprets his desire to become smart in terms of Rose&#x27;s hopes and his need for her love. Despite judging Guarino exploitative, he values having been treated as a human being and rejects Nemur&#x27;s implied claim to have created him.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>PROGRESS REPORT 13 · June 10</h2><p>:

 13</h2><p>Charlie finds Algernon by a washbasin and hides him in his jacket. He leaves using his return ticket and dictates on the plane with Algernon in a shoebox under the seat. He plans temporary lodging and a new apartment, wants to see his parents, and says his suspected mistake does not necessarily imply serious harm.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>PROGRESS REPORT 13 · June 11 – June 13</h2><p>:
