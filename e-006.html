      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · Progris riport 1 martch 3</summary><h2>Charlie&#x27;s employment</h2><p>Charlie Gordon says he works at Donners bakery. He reports receiving eleven dollars weekly from Mr Donner and bread or cake if wanted.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>The janitor job</h2><p>Charlie identifies his role as janitor and says Uncle Herman obtained the job for him before dying.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Work placement and apprenticeship</h2><p>Donner describes taking Charlie on seventeen years earlier and later arranging an outside work placement from Warren. He promises Charlie continued employment while retaining Ernie as an apprentice with Charlie assisting.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>The mixer vacancy and a remembered workplace</h2><p>Oliver leaves the mixer job. Charlie demonstrates he can operate it and Donner gives him the post with a five-dollar raise.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>The mixer vacancy and a remembered workplace</h2><p>Charlie identifies the remembered sign as DONNER&#x27;S BAKERY.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>The mixer vacancy and a remembered workplace</h2><p>In Charlie&#x27;s early-work recollection, flour makes the floor white while the walls and ceiling are sooty. These are remembered historical surroundings, not a dated present inspection.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>Rearranging the mixing machines</h2><p>Charlie devises a faster machine arrangement. Donner predicts reduced labor costs and higher profits and awards a bonus and raise. Charlie describes the social atmosphere as distant despite his advancement.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>The sales Charlie questions</h2><p>Charlie describes a cake normally priced at $3.95 being rung at $2.95 and sees Gimpy pocket a half-dollar. On a second sale he calculates Mrs Wheeler&#x27;s total as $4.53 but hears a charge of $2.45. He concludes there is deliberate undercharging; this remains his stated inference from the observations.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>The end of Charlie&#x27;s employment</h2><p>Charlie is dismissed on May 20. Donner says the quality of his work is not at issue and cites staff visits and a delegation. Frank voices resentment about Charlie making coworkers look foolish, while Fanny alone reportedly refuses the petition.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>The return and the coworkers’ protection</h2><p>Donner accepts Charlie’s return and he resumes cleaning work. Klaus mocks and hurts him, Joe intervenes, and Gimpy promises friendship and protection from himself, Joe and Frank. Charlie argues for another chance for Klaus.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><p><a href="assets/19c28cf1deeac4.jpg">Open noncanonical illustration</a></p><p>Working the dough mixer.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><p><a href="assets/062e2589134121.jpg">Open noncanonical illustration</a></p><p>The remembered bakery worker.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><p><a href="assets/7b53470aaf81b8.jpg">Open noncanonical illustration</a></p><p>A sale observed by Charlie.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><p><a href="assets/7047ea7b0dad18.jpg">Open noncanonical illustration</a></p><p>Gimpy assures Charlie that he has friends.</p></details></noscript>
