      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>Introduction</h2><p>Fay Lillman is a painter who lives across the hall from Charlie Gordon. A fire escape connects their windows.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>Painter across the hall</h2><p>Charlie meets Fay, his neighbor, on June 19. She is painting at an easel in a cluttered studio. She says she avoids Greenwich Village to concentrate on painting and has removed her door lock.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>Appearance</h2><p>Charlie describes a slender woman about thirty-five, blue eyes, a snub nose and athletic movements, with a chin beauty mark and blonde braids coiled like a crown. He first sees her in pink underwear; she later wears a ragged housecoat.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>Painter across the hall</h2><p>Fay loves dancing and asks for a loan until her alimony check. She teases Charlie that his maze is living sculpture. He invites her to play his piano and she leaves with five dollars. His attraction remains his stated response.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>Dancing, companionship and an overnight stay</h2><p>Fay brings Minnie for Algernon and starts teaching Charlie dance steps. She later brings Leroy home from the Stardust Ballroom. Charlie hears a disturbance before Leroy leaves. Fay says she does not owe a man sex because she brought him home.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>Dancing, companionship and an overnight stay</h2><p>She offers intimacy to Charlie, but he feels detached. After he gets drunk, she reports no sex and describes his childlike talk about school and peanuts. She says she stayed from concern that he might hurt himself. Her psychological guesses are not diagnoses.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>An important relationship and a reported kindness</h2><p>Charlie reports a sexual relationship and gives Fay a key. He says it is important to him but not love. He dedicates a piano concerto to her. His account says her marriage ended five years earlier over domestic disorder.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>An important relationship and a reported kindness</h2><p>Charlie learns she sheltered a girl who disappeared with her money. Fay says she will not pursue the girl because she must have needed it. These provide concrete support for Charlie’s favorable view without turning every impression into an objective trait.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>An important relationship and a reported kindness</h2><p>Their nightly outings interfere with his work, and Fay reports his drunken performance was taken as a comic act. Algernon later bites her thumb when she tries to pick him up.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><h2>Meeting Alice and diverging routines</h2><p>Fay meets Alice and the women enjoy talking. Alice likes her but questions the drinking and its effect on Charlie’s work. Charlie has not told Fay his history.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><h2>Meeting Alice and diverging routines</h2><p>Charlie experiences her as uninterested in the research, moves a cot into the lab and later finds she has a new boyfriend, a Stardust dance instructor. His earlier closeness to her is preserved rather than rewritten in light of this change.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 3 – October 11</summary><h2>Concern passed to Alice</h2><p>Alice says she contacted Fay, who was worried about Charlie and enabled her fire-escape visit. This later act of concern is retained alongside their diverging routines.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>The closed door</h2><p>Fay tells Charlie not to return and installs a new lock. His earlier impression that she fears him is his interpretation; the refusal and lock are the concrete actions recorded.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><p><a href="assets/e7caaf3d7973ef.jpg">Open noncanonical illustration</a></p><p>Fay Lillman.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><p><a href="assets/8c7321ecad5715.jpg">Open noncanonical illustration</a></p><p>Alice and Fay talk until dawn.</p></details></noscript>
