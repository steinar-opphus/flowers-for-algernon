      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Introduction</h2><p>Algernon is the white mouse Burt introduces to Charlie Gordon for a maze race in the laboratory.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>The first maze races</h2><p>Charlie sees Algernon finish the maze and reports that the mouse wins their first race and all ten further races.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>The first maze races</h2><p>Charlie sees Algernon finish the maze and reports that the mouse wins their first race and all ten further races.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>The operation, first losses and access to food</h2><p>Charlie learns that Algernon has had the same kind of operation. Strauss says the mouse became three times smarter and appears possibly to have a lasting improvement; this remains a qualified claim.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>The operation, first losses and access to food</h2><p>On March 29 Charlie reports winning nine of ten races against Algernon. When holding him, Charlie describes his fur as soft as cotton and his eyes as black with pink edges. Burt says access to food requires solving a changing lock. Charlie objects to that condition and wants to befriend him.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Variable performance and the escape</h2><p>Burt reports variable performance at Algernon&#x27;s peak intelligence, sometimes refusal to work and sometimes cage-directed behavior instead of eating after solving the lock. Burt says the cause is not established, offering surgery or an individual peculiarity as possibilities.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Variable performance and the escape</h2><p>Charlie opens the cage during Nemur&#x27;s speech. Algernon escapes the platform and Charlie finds him by a washbasin and mirror. Charlie hides him in his jacket and takes him toward New York in a shoebox under the plane seat.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Variable performance and the escape</h2><p>This report describes his eyes as “pink-candy.” The earlier black-with-pink-edges description is preserved; no actual color change is established by the different wording.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>Companion in the new apartment</h2><p>Charlie describes Algernon taking his place at the gateleg table and liking pretzels. He seeks motivation beyond food and builds a plastic three-dimensional maze attached to the living cage. Fay jokes that it is sculpture with a living element.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>Learning without food rewards</h2><p>Charlie reports increasingly complex time sequences learned without food or water rewards. He tentatively interprets solving as its own reward. Erratic wall-directed behavior and refusal persist; no cause is established. Fay brings Minnie as a companion.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>Biting and confused maze runs</h2><p>Charlie reports renewed erratic behavior and Minnie apparently afraid. On July 9 Algernon bites Fay’s thumb and catches Charlie’s sleeve. Minnie is found wounded but alive; the attack on her is not directly witnessed.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>Biting and confused maze runs</h2><p>Algernon still learns, but Charlie describes rushed, confused movements and collisions. He refuses a snap diagnosis and decides to return him to the lab.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 15 · July 12</summary><h2>Laboratory reassessment</h2><p>Back at the lab, Burt reports loss of complex responses and trial-and-error performance on a formerly patterned run. He allows that absence from the lab may contribute and proposes observing readjustment. Charlie asks to take charge of Algernon’s body rather than have it disposed of if he dies. This is a contingency request, not a death report.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><h2>Dependence and failed maze runs</h2><p>On July 15 Algernon refuses maze running and Burt feeds him by eyedropper. Charlie identifies distressingly with him.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · July 14 – July 31</summary><h2>Dependence and failed maze runs</h2><p>On July 28 Algernon completes two runs, fails the third, reacts intensely at a dead end and enters a temporary stupor with waxlike positioning. Charlie describes these signs without establishing an external clinical diagnosis or a general mechanism.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><h2>The final observations and burial</h2><p>Charlie’s report describes mental and physical deterioration. He later records that Algernon died two days before September 17. The reported postmortem findings include lower brain weight and changes in folds and fissures.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><h2>The final observations and burial</h2><p>Charlie takes his body home and buries him in the backyard, placing wild flowers on the grave while weeping. Earlier claims and observations remain preserved in their original sequence.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>Flowers in the last report</h2><p>Charlie continues putting flowers on Algernon’s grave and ends the book by asking someone else to do so when possible. The request preserves Algernon’s importance after Charlie can no longer recall his research clearly.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Appearance</h2><p>Charlie describes his fur as soft as cotton and his eyes as black with pink edges.</p></details><details><summary>Illustration · Flowers for Algernon · Progris riport 4 · mar 6</summary><p><a href="assets/734d99f1769dcc.jpg">Open noncanonical illustration</a></p><p>The maze race.</p></details><details><summary>Illustration · Flowers for Algernon · Progris riport 4 · mar 6</summary><p><a href="assets/a30fe04cf70095.jpg">Open noncanonical illustration</a></p><p>Algernon: representative portrait.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><p><a href="assets/46c20561c2ddf0.jpg">Open noncanonical illustration</a></p><p>Algernon in the convention corridor.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><p><a href="assets/19730f90fae0c1.jpg">Open noncanonical illustration</a></p><p>Wild flowers on Algernon’s grave.</p></details></noscript>
