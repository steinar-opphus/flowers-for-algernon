      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · 3d progris riport · martch 5</summary><h2>Introduction</h2><p>Charlie remembers his mother urging him to try to learn. He has not seen her, his father or Norma for many years.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>The recalled response to the crying baby</h2><p>Charlie recalls trying to comfort the crying baby by picking her up. His mother takes the baby away and slaps him, saying he could hurt her and must not touch her. Charlie now interprets her reaction as fear that he did not understand what he was doing; this is his later reading of the memory.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>A name and an unclear remembered face</h2><p>Charlie now remembers his mother&#x27;s name as Rose. In the childhood recollection she is thin and dark-haired, with her hair in a bun; her face remains unclear.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>A name and an unclear remembered face</h2><p>The recollected Rose insists Charlie can learn like other children, knocks his spinner away and later begins spanking him after he soils himself. These are Charlie&#x27;s recovered recollections, distinct from the preceding dream.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>The recalled threat of confinement</h2><p>Charlie recalls Rose threatening lifelong confinement if he touched a girl. He also recalls his father trying to restrain her from beating him. These memories arise during present distress and are kept attributed to Charlie.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>The remembered disagreement about a dog</h2><p>In Charlie&#x27;s recollection Norma wants a dog as a reward for schoolwork. Matt objects because Charlie&#x27;s own request had been refused, and ultimately refuses the dog. Charlie later hears Norma deny their kinship and attribute the story to their mother; that attribution is not independent confirmation of what Rose said.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>The Guarino visit and the surname Gordon</h2><p>The recollection explicitly calls Charlie&#x27;s mother Rose Gordon. She wears a half-veiled hat and insists Guarino can help despite Matt&#x27;s questions. She says the effort is worth any cost.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>The Guarino visit and the surname Gordon</h2><p>Rose expresses shame about Charlie&#x27;s loss of bodily control, while Guarino asks her not to punish him. Charlie later interprets his own drive to become smart through his wish to be the son she wanted and earn her love. This is his retrospective understanding.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>A photograph and memories of rejection</h2><p>The newspaper places Rose with Norma in Brooklyn. Charlie describes her photographed thin face, sharp nose and chin, dark eyes and severe bun.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>A photograph and memories of rejection</h2><p>The photograph brings back alternating tenderness and anger. Charlie interprets her changed treatment as connected with Norma’s development. In his recalled parental argument, Rose demands his removal to Warren; Matt protests. He postpones seeing her.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>The remembered night of departure</h2><p>Charlie recalls Rose demanding he leave that night and Matt telling her to put a knife down. Matt says he will take him to Herman and Charlie remembers seeing a carving knife as they leave. The recalled words and his sense of threat are preserved as memory, not a newly witnessed event.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · September 27</summary><h2>Recognition, confusion and the visit</h2><p>At the visit Rose wears an old brown sweater while washing windows, with white iron-streaked hair and wrinkled cheeks. She recognizes Charlie but retreats. He forces entry and cuts his hand; she then washes it.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · September 27</summary><h2>Recognition, confusion and the visit</h2><p>Rose moves between confusion about a bill, a story of an “evil-I.Q.,” and recognition of Charlie’s changed abilities. Her plans include people no longer in their former circumstances. Norma describes memory loss and a proposed nursing-home placement; this is her account rather than an independent diagnosis.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · September 27</summary><h2>Recognition, confusion and the visit</h2><p>Charlie gives Rose his report. Later she points a knife at him while making an accusation about Norma, who removes it. The accusation is not evidence that the alleged conduct occurred. Charlie reports no supporting memories and seeks forgiveness without erasing what happened.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><p><a href="assets/5edcfde4e9346e.jpg">Open noncanonical illustration</a></p><p>The remembered adult outlines.</p></details><details><summary>Illustration · Flowers for Algernon · 3d progris riport · martch 5</summary><p><a href="assets/be11a5ca8da17d.jpg">Open noncanonical illustration</a></p><p>An artistic portrait of Charlie’s mother.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 16 · September 27</summary><p><a href="assets/8a1c477fec268c.jpg">Open noncanonical illustration</a></p><p>Rose cleaning the windows on Marks Street.</p></details></noscript>
