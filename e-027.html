      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Funding the project</h2><p>Burt identifies the Welberg foundation as providing money for the project.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>Salary from the grant</h2><p>Charlie says the foundation now pays him a salary from the grant so that he need not find another job.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 24 – July 9</summary><h2>Request for independent research</h2><p>Charlie plans to ask the board for permission to conduct independent work. At the end of this unit the decision is not recorded; he resolves to return Algernon to the lab regardless.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 15 · July 12</summary><h2>Permission and lifetime provision</h2><p>Nemur says the foundation has authorized Charlie’s project work, staff/lab access and computer priority. He also describes the agreement with Charlie’s sister for Warren fees and a lifelong personal allowance in the event of failure. The arrangement does not require residence if Charlie can manage independently, according to Nemur.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 16 · August 11 – September 21</summary><h2>The party’s research debate</h2><p>Harvey and Raynor appear as foundation representatives at Bertha’s party. Raynor stresses practical results and institutional image, while Strauss defends research with uncertain or negative outcomes.</p></details></noscript>
