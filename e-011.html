      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · 3d progris riport · martch 5</summary><h2>Introduction</h2><p>Charlie’s father belongs to the family he has not seen for many years, along with his mother and younger sister Norma.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>The recalled reassurance about the baby</h2><p>Charlie recalls his father saying he would not harm the baby. This is a statement within Charlie&#x27;s recovered recollection, rather than an independently observed conversation.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>The childhood kitchen recollection</h2><p>Charlie remembers his father as Matt, with a massive, slumped outline but an unclear face.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>The childhood kitchen recollection</h2><p>In the recollection Matt argues that pressuring Charlie to act like other children is unfair. Charlie remembers him leaving as Rose begins spanking him.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>The recalled attempt to restrain Rose</h2><p>Charlie recalls Matt trying to restrain Rose from beating him. This later recollection adds to, rather than silently replaces, the earlier account of Matt leaving during another incident.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 12 · June 5 – June 8</summary><h2>The remembered fairness dispute</h2><p>In the recollection Matt tells Norma not to shout at Charlie and objects to granting her a dog after refusing Charlie&#x27;s request. He ultimately says there will be no dog.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>Supplies sales and doubts about the treatment</h2><p>In the recollection Matt has a heavy face and neck with sagging flesh. He says he sells barbershop supplies and questions Guarino&#x27;s ability to help and the ten-dollar cost.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>Supplies sales and doubts about the treatment</h2><p>Matt says their savings have gone on quacks and phonies and that the money could have given him a barbershop of his own. This is a remembered aspiration, not evidence that he owns a shop at this point.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>A reported Bronx barbershop</h2><p>The Daily Press calls him Matthew Gordon and says he operates a Bronx barbershop apart from Rose and Norma. This is the newspaper’s report of his current circumstances.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 15 – June 19</summary><h2>A reported Bronx barbershop</h2><p>In Charlie’s recalled argument about sending him away, Matt says Charlie would not harm Norma.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>At Gordons Barber Shop</h2><p>Charlie finds Matt in his own Bronx shop. He describes a stocky red-cheeked man, nearly bald with gray hair at the sides. Charlie remembers his father’s wish for this work and his earlier defense of his son.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>At Gordons Barber Shop</h2><p>Matt treats Charlie as an unrecognized customer, apologizes after a shaving nick and offers help when he becomes faint. Charlie leaves without explaining the relationship.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 14 · June 20 – June 23</summary><h2>At Gordons Barber Shop</h2><p>In a recollection during the visit, Matt takes Charlie away to Herman after Rose’s demand and the knife incident. That remembered departure is distinct from proof of a stay at Warren.</p></details><details><summary>Illustration · Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><p><a href="assets/5edcfde4e9346e.jpg">Open noncanonical illustration</a></p><p>The remembered adult outlines.</p></details><details><summary>Illustration · Flowers for Algernon · 3d progris riport · martch 5</summary><p><a href="assets/8bbc8c533e7a80.jpg">Open noncanonical illustration</a></p><p>An artistic portrait of Charlie’s father.</p></details></noscript>
