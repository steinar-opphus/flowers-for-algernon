      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · Progris riport 2—martch 4</summary><h2>Introduction</h2><p>Burt administers the ink-card test to Charlie Gordon, asking him to imagine pictures in the inkblots.</p></details><details><summary>Flowers for Algernon · Progris riport 4 · mar 6</summary><h2>Introducing the animal maze</h2><p>Charlie now gives Burt&#x27;s full name as Burt Selden. Burt asks him to trace a paper maze, then introduces Algernon in the animal laboratory. Burt sets up matched races by rearranging the mouse&#x27;s movable maze boards. He explains the electric feedback to Charlie as a signal that a move is wrong.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 7 MARCH 11 · MARCH 11 – March 13</summary><h2>Post-operation records</h2><p>Burt tells Charlie the operation is over when he wakes with bandaged eyes. Charlie says Burt records his temperature and blood pressure daily. Burt explains that the records support repeatability and that the progress reports are copied to study Charlie&#x27;s mind.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Graduate study and the project&#x27;s secrecy</h2><p>Charlie identifies Burt as a graduate psychology student. Burt predicts Charlie will surpass the students if the experiment works and explains secrecy in terms of Nemur&#x27;s fear of ridicule.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>IQ and the recorded inkblot instructions</h2><p>Burt says IQ measures multiple things and is not a sound general measure of intelligence. In the new Rorschach session he explains the need for consistent wording. A recording played to Charlie asks what the inkblot makes him think of. Charlie subsequently imagines figures in the cards but reports continuing distrust.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 10</summary><h2>The dictation suggestion</h2><p>Burt suggests a transistor recorder and professional transcription in Chicago as an alternative way for Charlie to produce the reports.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Tolerance and uncertainty in the animal results</h2><p>Burt says he respects Nemur&#x27;s dedication and tells Charlie that understanding and tolerance have lagged behind knowledge. He attributes Nemur&#x27;s professional pressures partly to Bertha.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 13 · June 11 – June 13</summary><h2>Tolerance and uncertainty in the animal results</h2><p>At the demonstration Burt explains the shifting food lock and reports variable performance. He explicitly says the evidence does not establish increased intelligence as the cause. Surgery as a common cause and an individual difference remain alternatives.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 15 · July 12</summary><h2>Reassessment and laboratory procedures</h2><p>Burt reports Algernon’s loss of complex responses while leaving room for an effect of absence from the lab. He teaches Charlie laboratory procedures and describes specimen freezing before incineration. Charlie asks him to preserve Algernon for him if he dies.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 3 – October 11</summary><h2>The tests Charlie stops</h2><p>Burt says his thesis is being retyped and expects the PhD in February, a future expectation rather than an awarded degree. He emphasizes that testing is voluntary. Charlie struggles with the maze and cannot recall how to control ink-card responses, then ends testing and leaves.</p></details><details><summary>Flowers for Algernon · Progris riport 2—martch 4</summary><h2>Appearance</h2><p>Charlie describes him wearing a white coat like a doctor’s.</p></details><details><summary>Flowers for Algernon · Progris riport 2—martch 4</summary><h2>Personality</h2><p>Charlie finds Burt nice and describes him speaking slowly, like Miss Kinnian.</p></details><details><summary>Illustration · Flowers for Algernon · Progris riport 2—martch 4</summary><p><a href="assets/9e42bc231e9222.jpg">Open noncanonical illustration</a></p><p>Inkblot test: scene brief.</p></details><details><summary>Illustration · Flowers for Algernon · Progris riport 4 · mar 6</summary><p><a href="assets/734d99f1769dcc.jpg">Open noncanonical illustration</a></p><p>The maze race.</p></details></noscript>
