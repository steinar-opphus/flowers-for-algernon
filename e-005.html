      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed reading-unit disclosures.</p><details><summary>Flowers for Algernon · Progris riport 1 martch 3</summary><h2>Introduction</h2><p>Mr Donner pays Charlie Gordon eleven dollars a week for his work at Donners bakery.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Herman&#x27;s arrangement and the promise of work</h2><p>Donner says Charlie came to the bakery seventeen years earlier at the request of his best friend Herman. He says Charlie&#x27;s mother committed him to Warren after Herman&#x27;s death and that he obtained an outside work placement for Charlie. He promises lifelong employment.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 8 · March 15 – March 31</summary><h2>Herman&#x27;s arrangement and the promise of work</h2><p>Donner retains Ernie as an apprentice and says Charlie can assist with deliveries. Charlie asks for an apprenticeship himself.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 9 · April 1 – April 18</summary><h2>Promotion to the mixer</h2><p>After Gimpy reports Charlie&#x27;s skill, Donner assigns him the mixer job with a five-dollar raise. Charlie initially asks to retain his old duties. This is a change in Charlie&#x27;s work, preserved separately from Donner&#x27;s earlier promise of lifelong employment.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 10 · April 21 – April 28</summary><h2>Rewards for increased production</h2><p>Donner predicts labor savings and increased profits from Charlie&#x27;s new machine arrangement and gives him a fifty-dollar bonus and ten-dollar weekly raise. Charlie later reports Donner arranging union membership and another raise whose amount is not given.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 1 – May 10</summary><h2>The loyalty behind Charlie&#x27;s dilemma</h2><p>Charlie recalls Donner inviting Gimpy&#x27;s family to dinner and has heard stories of him paying Gimpy&#x27;s wife&#x27;s hospital bills. Those stories remain attributed. Charlie is torn over whether to tell him about the sales he interprets as deliberate undercharging.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>Appearance and the dismissal decision</h2><p>Charlie describes Donner as short and chubby, with a ragged light-brown moustache drooping over his upper lip. Donner refers to himself as Arthur Donner.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>Appearance and the dismissal decision</h2><p>Donner says his own son died serving his country. He describes arranging work and lodging for Charlie so that he never spent a night at Warren. This clarifies his account of the earlier placement.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 11 · May 11 – May 25</summary><h2>Appearance and the dismissal decision</h2><p>Donner says Charlie&#x27;s work is not at fault but cites employee pressure and argues Charlie no longer needs the job. He allows an appeal to the workers. This is his stated justification, distinct from his earlier promise of continuing work.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 15 · July 12</summary><h2>Charlie’s account of the placement</h2><p>Charlie recalls Donner getting him outside work and living promptly after commitment following Herman’s death. This is consistent with Donner’s earlier statement that Charlie did not spend a night at Warren; no prolonged stay is inferred.</p></details><details><summary>Flowers for Algernon · PROGRESS REPORT 17 · October 14 – nov 21</summary><h2>Charlie returns to the bakery</h2><p>Donner hears Charlie’s explanation and lets him return to his old work. This later acceptance follows the earlier dismissal without erasing its historical account.</p></details><details><summary>Illustration · Flowers for Algernon · Progris riport 1 martch 3</summary><p><a href="assets/9adfdb52e3decd.jpg">Open noncanonical illustration</a></p><p>Mr Donner: representative portrait.</p></details></noscript>
